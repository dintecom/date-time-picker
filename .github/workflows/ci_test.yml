name: CI Test

on:
  push:
    branches: [ master ]
    paths-ignore:
    - '*.md'
    - '.github/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
    - '*.md'
    - '.github/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
            node-version: lts/*
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm run test:ci
        env:
          CI: true
